<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connected accounts · Demo</title>
    <style>
      /* Flung's own typeface, as its docs and apps load it; the panel picks it up from the page. */
      @font-face { font-family: 'Rethink Sans'; font-weight: 400 800; font-display: swap; src: url('https://assets.flung.dev/fonts/rethink-sans-5.3.0/rethink-sans-latin-wght-normal.woff2') format('woff2'); }
      :root { color-scheme: light dark; --bg: #f7f6f3; --text: #16141c; --muted: #6b6573; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0d12; --text: #f5f3f0; --muted: #a39dac; } }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 'Rethink Sans', system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Connected accounts</h1>
      <p>Posts go out to the accounts you connect here. Disconnect one at any time.</p>
      <flung-connect id="panel"></flung-connect>
    </main>
    <script type="module">
      import '/connect/register.js'

      const panel = document.getElementById('panel')
      panel.setAttribute('base-url', location.origin)
      // ?variants=tiles, ?layout=grid and so on: the panel's attributes, for shots of each.
      for (const [name, value] of new URLSearchParams(location.search)) if (['variants', 'layout', 'theme'].includes(name)) panel.setAttribute(name, value)
      panel.token = 'flung_ct_ZGVtbw.demo'
    </script>
  </body>
</html>
