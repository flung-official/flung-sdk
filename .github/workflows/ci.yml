name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit
        run: pnpm audit --prod --audit-level high
      - name: Type check, test, and the no-runtime-dependency guard
        run: pnpm check
        env:
          VITEST_MAX_WORKERS: 4
      - name: Build
        run: pnpm build
      - name: Pack each published package
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination ../../dist-packs

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [nextjs, react-vite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and pack each published package
        run: |
          pnpm build
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination ../../dist-packs
      - name: Install the example from its lockfile, then the packages from this change
        working-directory: examples/${{ matrix.example }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund ../../dist-packs/flung.dev-*.tgz
      - name: Type check
        working-directory: examples/${{ matrix.example }}
        run: npm run typecheck
      - name: Build
        working-directory: examples/${{ matrix.example }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
